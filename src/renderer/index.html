<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mediescare</title>
  <link rel="icon" href="assets/blank.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header id="window-titlebar" class="window-titlebar">
    <div class="window-nav">
      <button type="button" class="window-nav-btn" id="win-nav-back" title="Back (Alt+Left)" aria-label="Back" disabled>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <button type="button" class="window-nav-btn" id="win-nav-forward" title="Forward (Alt+Right)" aria-label="Forward" disabled>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </div>
    <div class="window-title-content">
      <img src="assets/mediescare-icon.svg" class="window-title-icon" alt="" />
      <span id="window-title-text" class="window-title-text">Home</span>
    </div>
  </header>
  <div id="root" aria-live="polite"></div>
  <div id="overlays"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
